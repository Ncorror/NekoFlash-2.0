name: English Insiders gallery
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/insiders-screenshots.yml
      - scripts/capture_insiders_screenshots.py
permissions:
  contents: read
jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Download the published field APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(cat docs/insiders/campaign-tag.txt)
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'NekoFlash-Insiders-*.zip' --dir download
          unzip -q 'download/*.zip' '*.apk' testbook.html -d kit
          mkdir gallery
          python3 scripts/verify_insiders_kit.py kit > gallery/BUILD.txt
          sudo chmod 666 /dev/kvm
      - name: Capture from the installed app in English
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install kit/NekoFlash-*-debug.apk
            python3 scripts/capture_insiders_screenshots.py gallery
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: NekoFlash-English-Gallery
          path: gallery/
