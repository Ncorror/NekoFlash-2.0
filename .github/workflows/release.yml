name: Publish NekoFlash Release

run-name: Release ${{ github.ref_name }}

on:
  push:
    branches:
      - main
    paths:
      - '.github/RELEASE_REQUEST'
    tags:
      - 'v*'

permissions:
  contents: read

env:
  EXPECTED_RELEASE_CERT_SHA256: "3d9d8ec98ff5a0aa5e72a257f02babe19c0ff91f0af431955aa9afe8901cf5b2"

jobs:
  tag-provenance:
    name: Verify/create approved release tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      tag: ${{ steps.provenance.outputs.tag }}
      version_name: ${{ steps.provenance.outputs.version_name }}
      version_code: ${{ steps.provenance.outputs.version_code }}
    steps:
      - name: Checkout release source without release secrets
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Verify main provenance and prepare version tag
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --tags --force origin '+refs/heads/main:refs/remotes/origin/main'
          VERSION="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle | head -1)"
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle | head -1)"
          test -n "$VERSION"
          test -n "$VERSION_CODE"
          EXPECTED_TAG="v$VERSION"
          case "$VERSION" in
            *dev*|*snapshot*|*SNAPSHOT*)
              echo "::error::Development versions cannot be published: $VERSION"
              exit 1
              ;;
          esac
          MAIN_TIP="$(git rev-parse refs/remotes/origin/main^{commit})"
          case "$GITHUB_REF" in
            refs/tags/*)
              TAG="${GITHUB_REF#refs/tags/}"
              TAG_COMMIT="$(git rev-parse HEAD^{commit})"
              [ "$TAG" = "$EXPECTED_TAG" ] || { echo "::error::Tag $TAG does not match $EXPECTED_TAG"; exit 1; }
              [ "$TAG_COMMIT" = "$MAIN_TIP" ] || { echo "::error::Release tag must point to current main"; exit 1; }
              ;;
            refs/heads/main)
              test -s .github/RELEASE_REQUEST || { echo "::error::Missing .github/RELEASE_REQUEST"; exit 1; }
              TAG="$(tr -d '[:space:]' < .github/RELEASE_REQUEST)"
              [ "$TAG" = "$EXPECTED_TAG" ] || { echo "::error::Release request $TAG does not match $EXPECTED_TAG"; exit 1; }
              TAG_COMMIT="$(git rev-parse HEAD^{commit})"
              [ "$TAG_COMMIT" = "$MAIN_TIP" ] || { echo "::error::Release request is not current main"; exit 1; }
              for attempt in $(seq 1 60); do
                JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?head_sha=$TAG_COMMIT&event=push&per_page=10")"
                SUCCESS_COUNT="$(printf '%s' "$JSON" | jq '[.workflow_runs[] | select(.head_sha == "'"$TAG_COMMIT"'" and .event == "push" and .conclusion == "success")] | length')"
                FAILURE_COUNT="$(printf '%s' "$JSON" | jq '[.workflow_runs[] | select(.head_sha == "'"$TAG_COMMIT"'" and .event == "push" and (.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out"))] | length')"
                if [ "$SUCCESS_COUNT" -gt 0 ]; then
                  echo "Exact-SHA main CI PASS before tag creation: $TAG_COMMIT"
                  break
                fi
                if [ "$FAILURE_COUNT" -gt 0 ]; then
                  echo "::error::Exact-SHA main CI failed; refusing to create $TAG"
                  exit 1
                fi
                if [ "$attempt" -eq 60 ]; then
                  echo "::error::Timed out waiting for exact-SHA main CI before tag creation"
                  exit 1
                fi
                echo "Waiting for exact-SHA main CI before tag creation: attempt $attempt/60"
                sleep 30
              done
              if git show-ref --verify --quiet "refs/tags/$TAG"; then
                EXISTING="$(git rev-parse "$TAG^{commit}")"
                [ "$EXISTING" = "$TAG_COMMIT" ] || { echo "::error::Existing tag points to another commit"; exit 1; }
              else
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git tag -a "$TAG" "$TAG_COMMIT" -m "NekoFlash $VERSION"
                git push origin "refs/tags/$TAG"
              fi
              ;;
            *)
              echo "::error::Release workflow must run from a version tag or current main release request"
              exit 1
              ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Release provenance OK: $TAG -> $TAG_COMMIT"
  release:
    name: Build, verify and publish signed APK
    runs-on: ubuntu-latest
    needs: tag-provenance
    permissions:
      contents: write
      actions: read
    # Only approved release environment may expose signing secrets.
    environment: nekoflash-release

    steps:
      - name: Require green main CI for this exact release SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          TARGET_SHA="$GITHUB_SHA"

          for attempt in $(seq 1 60); do
            JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?head_sha=$TARGET_SHA&event=push&per_page=10")"

            SUCCESS_COUNT="$(printf '%s' "$JSON" | jq '[.workflow_runs[] | select(.head_sha == "'"$TARGET_SHA"'" and .event == "push" and .conclusion == "success")] | length')"
            FAILURE_COUNT="$(printf '%s' "$JSON" | jq '[.workflow_runs[] | select(.head_sha == "'"$TARGET_SHA"'" and .event == "push" and (.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out"))] | length')"

            if [ "$SUCCESS_COUNT" -gt 0 ]; then
              echo "Exact-SHA main CI PASS: $TARGET_SHA"
              exit 0
            fi

            if [ "$FAILURE_COUNT" -gt 0 ]; then
              echo "::error::Exact-SHA main CI failed for $TARGET_SHA"
              exit 1
            fi

            echo "Waiting for exact-SHA main CI: attempt $attempt/60"
            sleep 30
          done

          echo "::error::Timed out waiting for exact-SHA main CI: $TARGET_SHA"
          exit 1

      - name: Checkout release source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Validate release tag and project version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ needs.tag-provenance.outputs.tag }}"

          VERSION_NAME="$(
            sed -nE \
              's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' \
              app/build.gradle |
            head -n 1
          )"

          VERSION_CODE="$(
            sed -nE \
              's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' \
              app/build.gradle |
            head -n 1
          )"

          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"

          EXPECTED_TAG="v${VERSION_NAME}"

          echo "Tag:          $TAG"
          echo "Version name: $VERSION_NAME"
          echo "Version code: $VERSION_CODE"

          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "::error::Tag '$TAG' does not match project version '$EXPECTED_TAG'"
            exit 1
          fi

          case "$VERSION_NAME" in
            *dev*|*snapshot*|*SNAPSHOT*)
              echo "::error::Development version cannot be published: $VERSION_NAME"
              exit 1
              ;;
          esac

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.properties

          git ls-files \
            --error-unmatch \
            gradle/wrapper/gradle-wrapper.jar \
            >/dev/null

          sha256sum gradle/wrapper/gradle-wrapper.jar

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Prepare and verify permanent release key
        env:
          NEKOFLASH_KEYSTORE_BASE64: ${{ secrets.NEKOFLASH_KEYSTORE_BASE64 }}
          NEKOFLASH_STORE_PASSWORD: ${{ secrets.NEKOFLASH_STORE_PASSWORD }}
          NEKOFLASH_KEY_ALIAS: ${{ secrets.NEKOFLASH_KEY_ALIAS }}
          NEKOFLASH_KEY_PASSWORD: ${{ secrets.NEKOFLASH_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          [ -n "$NEKOFLASH_KEYSTORE_BASE64" ] || {
            echo "::error::Missing NEKOFLASH_KEYSTORE_BASE64"
            exit 1
          }

          [ -n "$NEKOFLASH_STORE_PASSWORD" ] || {
            echo "::error::Missing NEKOFLASH_STORE_PASSWORD"
            exit 1
          }

          [ -n "$NEKOFLASH_KEY_ALIAS" ] || {
            echo "::error::Missing NEKOFLASH_KEY_ALIAS"
            exit 1
          }

          [ -n "$NEKOFLASH_KEY_PASSWORD" ] || {
            echo "::error::Missing NEKOFLASH_KEY_PASSWORD"
            exit 1
          }

          KEYSTORE_PATH="$RUNNER_TEMP/nekoflash-release.jks"

          printf '%s' "$NEKOFLASH_KEYSTORE_BASE64" |
            base64 --decode > "$KEYSTORE_PATH"

          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

          CERT_PEM="$RUNNER_TEMP/nekoflash-release-cert.pem"

          keytool \
            -exportcert \
            -rfc \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$NEKOFLASH_STORE_PASSWORD" \
            -alias "$NEKOFLASH_KEY_ALIAS" \
            > "$CERT_PEM"

          ACTUAL_CERT_SHA256="$(
            openssl x509 \
              -in "$CERT_PEM" \
              -noout \
              -fingerprint \
              -sha256 |
            sed 's/^.*=//' |
            tr -d ':' |
            tr '[:upper:]' '[:lower:]'
          )"

          echo "Expected certificate: $EXPECTED_RELEASE_CERT_SHA256"
          echo "Actual certificate:   $ACTUAL_CERT_SHA256"

          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_RELEASE_CERT_SHA256" ]; then
            echo "::error::Release certificate SHA-256 mismatch"
            exit 1
          fi

          echo "NEKOFLASH_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Make Gradle Wrapper executable
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          chmod +x scripts/*.sh 2>/dev/null || true
          test -x gradlew
          ls -l gradlew

      - name: REV26 structural, source-guard and bilingual checks
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/check_rev26.py
          python3 tests/check_i18n.py
          python3 tests/check_docs.py

      - name: Native transfer deadline regression tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined tests/native_transfer_deadline_test.cpp -o /tmp/native-deadline-test
          /tmp/native-deadline-test

      - name: Install filesystem integration-test tools
        run: |
          bash scripts/ci-install-filesystem-deps.sh e2fsprogs f2fs-tools autoconf automake libtool pkg-config

      - name: Build pinned Android filesystem generators
        timeout-minutes: 20
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
          python3 scripts/build_filesystem_tools.py --ndk "$ANDROID_HOME/ndk/27.2.12479018"

      - name: Kotlin JVM regression tests
        timeout-minutes: 15
        shell: bash
        run: |
          ./gradlew :app:testDebugUnitTest \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Android lint
        timeout-minutes: 15
        shell: bash
        run: |
          set -o pipefail

          ./gradlew :app:lintDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --console=plain 2>&1 |
          tee lint_log.txt

      - name: Build signed Release APK
        timeout-minutes: 20
        env:
          NEKOFLASH_STORE_PASSWORD: ${{ secrets.NEKOFLASH_STORE_PASSWORD }}
          NEKOFLASH_KEY_ALIAS: ${{ secrets.NEKOFLASH_KEY_ALIAS }}
          NEKOFLASH_KEY_PASSWORD: ${{ secrets.NEKOFLASH_KEY_PASSWORD }}
        shell: bash
        run: |
          set -o pipefail

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --console=plain 2>&1 |
          tee release_build_log.txt

      - name: Verify APK signature and release certificate
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_APK="$(
            find app/build/outputs/apk/release \
              -type f \
              -name '*.apk' \
              -print \
              -quit
          )"

          test -n "$RELEASE_APK"
          test -f "$RELEASE_APK"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          [ -n "$SDK_ROOT" ] || {
            echo "::error::Android SDK root not found"
            exit 1
          }

          APKSIGNER="$(
            find "$SDK_ROOT/build-tools" \
              -type f \
              -name apksigner \
              -print |
            sort -V |
            tail -n 1
          )"

          [ -n "$APKSIGNER" ] || {
            echo "::error::apksigner not found"
            exit 1
          }

          "$APKSIGNER" \
            verify \
            --verbose \
            --print-certs \
            "$RELEASE_APK" |
          tee apk-signature.txt

          APK_CERT_SHA256="$(
            sed -nE \
              's/^.*certificate SHA-256 digest:[[:space:]]*([0-9A-Fa-f:]+).*$/\1/p' \
              apk-signature.txt |
            head -n 1 |
            tr -d ':' |
            tr '[:upper:]' '[:lower:]'
          )"

          test -n "$APK_CERT_SHA256"

          echo "Expected APK certificate: $EXPECTED_RELEASE_CERT_SHA256"
          echo "Actual APK certificate:   $APK_CERT_SHA256"

          if [ "$APK_CERT_SHA256" != "$EXPECTED_RELEASE_CERT_SHA256" ]; then
            echo "::error::APK is not signed with the permanent NekoFlash release key"
            exit 1
          fi

          echo "source_apk=$RELEASE_APK" >> "$GITHUB_OUTPUT"

      - name: Prepare release package
        shell: bash
        run: |
          set -euo pipefail

          VERSION_NAME="${{ steps.version.outputs.version_name }}"
          VERSION_CODE="${{ steps.version.outputs.version_code }}"
          SOURCE_APK="${{ steps.apk.outputs.source_apk }}"

          mkdir -p release-dist

          FINAL_APK="NekoFlash-${VERSION_NAME}.apk"

          cp "$SOURCE_APK" "release-dist/$FINAL_APK"
          cp apk-signature.txt release-dist/apk-signature.txt

          cat > release-dist/build-info.txt <<EOF
          NekoFlash release
          versionName=$VERSION_NAME
          versionCode=$VERSION_CODE
          gitTag=${{ needs.tag-provenance.outputs.tag }}
          gitCommit=$GITHUB_SHA
          gitRunId=$GITHUB_RUN_ID
          releaseSigned=true
          certificateSha256=$EXPECTED_RELEASE_CERT_SHA256
          EOF

          python3 tests/check_filesystem_apk.py "release-dist/$FINAL_APK"
          cp build/filesystem-tools/filesystem-tools-source.tar.gz release-dist/
          cp build/filesystem-tools/build-info.json release-dist/filesystem-tools-build-info.json

          cd release-dist

          sha256sum "$FINAL_APK" > "${FINAL_APK}.sha256"

          echo
          echo "=== RELEASE FILES ==="
          ls -lh

          echo
          echo "=== BUILD INFO ==="
          cat build-info.txt

          echo
          echo "=== SHA256 ==="
          cat "${FINAL_APK}.sha256"

      - name: Upload verified release bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: NekoFlash-${{ steps.version.outputs.version_name }}-release
          path: release-dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$TAG" \
            release-dist/NekoFlash-"$VERSION_NAME".apk \
            release-dist/NekoFlash-"$VERSION_NAME".apk.sha256 \
            release-dist/filesystem-tools-source.tar.gz \
            --verify-tag \
            --title "NekoFlash $VERSION_NAME" \
            --generate-notes \
            --latest
